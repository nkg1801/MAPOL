<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>

    <script>
        var require = {
            paths: {
                'vs': './vs'
            }
        };
    </script>

    <script src="./vs/loader.js"></script>
</head>
<body>

    <div id="container"></div>

    <script>
        require(['vs/editor/editor.main'], function () {

            window.editor = monaco.editor.create(
                document.getElementById('container'),
                {
                    value: '<root>\n</root>',
                    language: 'xml',
                    theme: 'vs-dark',
                    automaticLayout: true
                }
            );

        });
    </script>

</body>
</html>
